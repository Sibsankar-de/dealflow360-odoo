version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dealflow-postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - dealflow_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dealflow
      TZ: UTC
      PGTZ: UTC

volumes:
  dealflow_postgres:
